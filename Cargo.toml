[package]
name = "gosh-ackinacki"
version = "0.11.0"
edition = "2021"
rust-version = "1.86.0"
license = "MIT"

[[bin]]
name = "gosh-ackinacki"
path = "src/main.rs"

# Feature split (see docs/ARCHITECTURE.md):
#   default (lean)  — thin chain client over the Block Manager GraphQL/HTTP API
#                     (reads, getters, writes, airegistry, wallet, crypto). No
#                     node, no transport-layer, no MsQuic/cmake build.
#   block-stream    — full-agent indexer: QUIC firehose from Block Keeper nodes
#                     (pulls `node` + `transport-layer` + MsQuic) → decode →
#                     filter → facts → gosh.memory ingest.
[features]
default = []
block-stream = ["dep:node", "dep:transport-layer"]
private-note = [
    "dep:dark_dex_halo2_private_witness_export_lib",
    "dep:gosh-dark-dex-halo2-new-circuit",
    "dep:halo2-base",
    "dep:halo2-proover",
    "dep:num-bigint",
]

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0.97"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
bincode = "1.3.3"
bytes = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4.3"
hkdf = "0.13"
rand = "0.8"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
sha2 = "0.11"
futures-util = "0.3"
tokio = { version = "1.44.2", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
num-bigint = { version = "0.4", optional = true }

# Acki Nacki node crates (the PUBLIC node, ackinacki/ackinacki) — only for the
# `block-stream` feature (the QUIC firehose indexer). They pull MsQuic
# (cmake/quictls); kept optional so the lean default build / thin-client lib
# never compiles them. Public so the indexer is buildable from the public mirror.
node = { git = "https://github.com/ackinacki/ackinacki.git", branch = "main", optional = true }
transport-layer = { git = "https://github.com/ackinacki/ackinacki.git", branch = "main", optional = true }
tvm_abi = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = "v3.0.4-rc.an" }
tvm_block = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = "v3.0.4-rc.an" }
tvm_client = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = "v3.0.4-rc.an", default-features = false, features = ["std", "rustls-tls-webpki-roots"] }
tvm_types = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = "v3.0.4-rc.an" }

# DEX PrivateNote halo2 voucher pipeline (PUBLIC repos). Optional so the lean
# chain client never compiles the heavy proving graph unless a consumer mints
# PrivateNotes in-process via `--features private-note`.
# Kit pinned to the `dark_dex_halo2_private_witness_export_lib-v0.2.0` tag
# (965d462a, on the kit's `main`). The on-chain `gosh.zkhalo2verify` accepts ONLY
# the circuit a specific kit revision produces — a wrong one yields exit 137. This
# tag's `dex-halo2-circuit` and `halo2-proover` sources are byte-identical to the
# previously live-proven rev 89e9346 (which is no longer on any kit branch); it
# differs only in the witness exporter, which now selects the tracked ext-out
# message whose hash matches `event_boc` instead of the first one in the block.
# Before moving this pin, diff the circuit/prover sources against the current one
# and run the live mint E2E. The direct `halo2-base` dep tracks `main`; the kit's
# transitive halo2/axiom graph still needs the stable-Rust `[patch]` block below.
halo2-proover = { git = "https://github.com/gosh-sh/dexdo-halo2-kit", tag = "dark_dex_halo2_private_witness_export_lib-v0.2.0", optional = true }
dark_dex_halo2_private_witness_export_lib = { git = "https://github.com/gosh-sh/dexdo-halo2-kit", tag = "dark_dex_halo2_private_witness_export_lib-v0.2.0", optional = true }
gosh-dark-dex-halo2-new-circuit = { git = "https://github.com/gosh-sh/dexdo-halo2-kit", tag = "dark_dex_halo2_private_witness_export_lib-v0.2.0", package = "dex-halo2-circuit", optional = true }
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "main", default-features = false, features = ["halo2-axiom", "test-utils"], optional = true }

# Stable-Rust compatibility patches. They redirect the nightly-gated crates
# (poseidon-primitives, halo2-axiom, axiom-eth) to gosh-sh stable forks; without
# them the build fails E0554 on stable. Two graphs need them: the `private-note`
# kit (paired with the pinned kit tag they produce the exact circuit
# `gosh.zkhalo2verify` accepts) AND — since the tvm-sdk v3.0.4 pin — `tvm_vm`'s own halo2 graph, which
# the LEAN default build pulls too.
#
# Cargo does NOT inherit `[patch]` from a git dependency's workspace root, so
# every CONSUMER of this crate must mirror this block in its own root manifest
# (see the README) — these entries only fix OUR build.
[patch.crates-io]
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
halo2-axiom = { git = "https://github.com/gosh-sh/halo2-axiom", branch = "main" }

[patch."https://github.com/axiom-crypto/halo2-lib.git"]
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
halo2-ecc = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
zkevm-hashes = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }

[patch."https://github.com/axiom-crypto/axiom-eth"]
axiom-eth = { git = "https://github.com/gosh-sh/axiom-eth", rev = "1d61be00a63ec73b3f709d74eb9e6b09b754b911" }
